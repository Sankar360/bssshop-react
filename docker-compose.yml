services:
  react:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: bssshop-react
    ports:
      - "5173:5173"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - CHOKIDAR_USEPOLLING=true
    networks:
      - bssshop

networks:
  bssshop:
    external: true
    name: bssshop-laravel_bssshop
